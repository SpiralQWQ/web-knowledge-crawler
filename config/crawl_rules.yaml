# ============================================================
# 三分类采集站点配置 — crawl_all.py 使用
# ============================================================
# 类别说明:
#   search = 站内搜索(有API或Playwright模拟的搜索功能)
#   seed   = 种子采集(已知URL列表,按term匹配后下载)
#   static = 静态下载(无搜索+无Cookie,直接HTTP GET)
# ============================================================

