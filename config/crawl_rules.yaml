seed_sites:
  # 从 seed 文件匹配关键词条目
  - name: repo_seeds
    type: seed
    category: repos       # → config/seeds/repo_seeds.txt
    max_matches: 50

  - name: doc_seeds
    type: seed
    category: docs        # → config/seeds/doc_seeds.txt
    max_matches: 50

  - name: video_keywords
    type: seed
    category: media       # → config/seeds/video_keywords_full.txt
    max_matches: 30

static_sites:
  # 已知 URL 直接下载(无需搜索/无需cookie)
  - name: static_pdfs
    type: static
    seed_file: config/seeds/static_pdfs.txt
    max_matches: 100
